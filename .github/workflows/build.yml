name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      # Tu tim thu muc co build.gradle (o goc repo hoac trong thu muc donutlike/)
      - name: Find project directory
        id: proj
        run: |
          if [ -f build.gradle ]; then echo "dir=." >> "$GITHUB_OUTPUT";
          elif [ -f donutlike/build.gradle ]; then echo "dir=donutlike" >> "$GITHUB_OUTPUT";
          else echo "Khong tim thay build.gradle" && exit 1; fi

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donutlike-mod
          path: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
            !${{ steps.proj.outputs.dir }}/build/libs/*-sources.jar

      - name: Create GitHub Release (khi push tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.proj.outputs.dir }}/build/libs/*.jar
